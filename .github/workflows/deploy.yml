name: build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: install
        run: npm ci

      - name: build
        run: npm run build

      # The GitHub Pages "artifact" actions are not available on every host, so we
      # publish the static build directly to the gh-pages branch instead.
      - name: publish to gh-pages
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .publish
          cp -r dist .publish
          touch .publish/.nojekyll
          cd .publish
          git init -q -b gh-pages
          # actions/checkout stores its credential header in the *local* config of
          # the checkout, so copy it into this throwaway repo before pushing.
          HDR="$(git -C "$GITHUB_WORKSPACE" config --get http.https://github.com/.extraheader || true)"
          if [ -n "$HDR" ]; then
            git config http.https://github.com/.extraheader "$HDR"
          fi
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA::8}"
          git push --force origin gh-pages
          echo "published gh-pages"