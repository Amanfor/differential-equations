name: build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: install
        run: npm ci

      - name: build
        run: npm run build

      # The GitHub Pages "artifact" actions are not available on every host, so we
      # publish the static build directly to the gh-pages branch instead.
      - name: publish to gh-pages
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .publish
          cp -r dist .publish
          touch .publish/.nojekyll
          cd .publish
          git init -q -b gh-pages
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA::8}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages